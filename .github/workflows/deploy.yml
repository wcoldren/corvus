# Every push to main deploys to GitHub Pages (SPEC.md, Testing and release).
# The deploy job needs verify, so a failing check deploys nothing, and what
# it deploys is the dist/ that verify built and tested. A pull request runs
# the same verify job and stops there, so it shows its check before merging.

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Redeploy by hand, e.g. after a rollback revert has already been pushed.
  workflow_dispatch:

permissions:
  contents: read

# Deploys run one at a time, and a queued deploy never cancels one in
# progress. Each pull request has its own group, so its checks never wait
# behind a deploy, and a new push to it cancels its older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # check-cards, tsc, the unit tests and vite build.
      - run: npm run verify
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
